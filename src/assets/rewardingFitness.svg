<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="140" y1="80" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C7AFF"/>
      <stop offset="0.5" stop-color="#5A4EE6"/>
      <stop offset="1" stop-color="#3A2BB6"/>
    </linearGradient>
    <radialGradient id="vignette" cx="512" cy="470" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#1A1060" stop-opacity="0"/>
      <stop offset="1" stop-color="#1A1060" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="topSheen" cx="350" cy="300" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerDisc" cx="512" cy="512" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#160C52" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>
    <rect width="1024" height="1024" fill="url(#topSheen)"/>
    <rect width="1024" height="1024" fill="url(#centerDisc)"/>
    <g fill="#FFFFFF" filter="url(#markShadow)">
      <rect x="308" y="442" width="44" height="140" rx="18"/>
      <rect x="348" y="397" width="44" height="230" rx="22"/>
      <rect x="372" y="486" width="280" height="52" rx="26"/>
      <rect x="632" y="397" width="44" height="230" rx="22"/>
      <rect x="672" y="442" width="44" height="140" rx="18"/>
    </g>
  </g>
</svg>
